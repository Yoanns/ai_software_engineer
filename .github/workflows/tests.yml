name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install PHP CLI
        run: sudo apt-get update && sudo apt-get install -y php-cli
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t ai-engineer:test .
      - name: Smoke-test app and non-root database access
        run: |
          docker run --rm ai-engineer:test python -c \
            "from app import app; from models import MemoryManager; assert app.test_client().get('/').status_code == 200; assert MemoryManager().count() == 0"
