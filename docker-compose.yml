version: '3.8'

services:
  ai-engineer:
    build: .
    ports:
      - "5001:5000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./models:/app/models
      - ./logs:/app/logs
    command: [
      "gunicorn",
      "--bind", "0.0.0.0:5000",
      "--timeout", "600",
      "--worker-class", "gevent",
      "--workers", "1",
      "app:app"
    ]
    restart: unless-stopped