services:
  ai-engineer:
    build:
      context: .
      args:
        INSTALL_LOCAL_MODELS: ${INSTALL_LOCAL_MODELS:-false}
    ports:
      - "127.0.0.1:5001:5000"
    env_file:
      - .env
    environment:
      MEMORY_DB_PATH: /app/data/memory.db
    volumes:
      - ai-engineer-data:/app/data
      - ./models:/app/models:ro
    restart: unless-stopped

volumes:
  ai-engineer-data:
